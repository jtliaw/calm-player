name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
      - run: flutter create --org com.calm --project-name calm_player --platforms=android .
      - run: python3 tools/patch_android.py
      - run: flutter pub get
      - run: flutter build apk --release --no-shrink --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: calm-player-apk
          path: build/app/outputs/flutter-apk/app-release.apk
